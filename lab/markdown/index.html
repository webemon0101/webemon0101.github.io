<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<title>Markdown 体験</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  :root { --bg:#0d1220; --panel:#161d2f; --line:#2a3550; --text:#e8ecf7; --muted:#8f9ac0; --accent:#7be0a4; --paper:#fff; --ink:#1d2433; }
  html, body { margin: 0; min-height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, "Yu Gothic", "Hiragino Sans", sans-serif; padding: 16px; max-width: 1200px; margin: 0 auto; }
  a.back { color: var(--accent); font-size: 13px; text-decoration: none; }
  h1 { margin: 8px 0 4px; font-size: clamp(20px, 5vw, 28px); }
  .lead { margin: 0 0 14px; color: var(--muted); font-size: 14px; line-height: 1.7; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  .chips button, .tabs button, .tools button { font: inherit; font-size: 13px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  .chips button:hover, .tools button:hover { border-color: var(--accent); }
  .tabs button.on { background: var(--accent); color: #0b2a1a; border-color: var(--accent); font-weight: 700; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 760px) { .cols { grid-template-columns: 1fr; } }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
  .box > .hd { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; color: var(--muted); }
  .tabs { display: flex; gap: 6px; }
  textarea { width: 100%; height: min(70vh, 640px); min-height: 280px; resize: vertical; border: 0; outline: 0; padding: 14px; background: #0f1524; color: #e8ecf7;
    font: 15px/1.7 ui-monospace, "Cascadia Mono", Consolas, monospace; tab-size: 2; }
  #out { height: min(70vh, 640px); min-height: 280px; overflow: auto; padding: 18px 22px; background: var(--paper); color: var(--ink); line-height: 1.8; font-size: 15px; overflow-wrap: anywhere; }
  #src { display: none; height: min(70vh, 640px); min-height: 280px; overflow: auto; margin: 0; padding: 14px; background: #0f1524; color: #bfe9cf; font: 13px/1.6 ui-monospace, Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  #out h1, #out h2, #out h3, #out h4, #out h5, #out h6 { line-height: 1.35; margin: 1.1em 0 .5em; }
  #out h1 { font-size: 1.7em; border-bottom: 2px solid #d8deea; padding-bottom: .2em; margin-top: 0; }
  #out h2 { font-size: 1.4em; border-bottom: 1px solid #e3e8f1; padding-bottom: .15em; }
  #out h3 { font-size: 1.2em; }
  #out p { margin: .7em 0; }
  #out ul, #out ol { margin: .6em 0; padding-left: 1.6em; }
  #out li.task { list-style: none; margin-left: -1.3em; }
  #out blockquote { margin: .8em 0; padding: .1em 1em; border-left: 4px solid #9db2d9; background: #f2f5fb; color: #46506a; }
  #out code { background: #eef1f7; padding: .1em .35em; border-radius: 4px; font: .9em ui-monospace, Consolas, monospace; }
  #out pre { background: #1d2433; color: #eaf0ff; padding: 12px 14px; border-radius: 8px; overflow: auto; }
  #out pre code { background: none; padding: 0; color: inherit; }
  #out table { border-collapse: collapse; margin: .8em 0; }
  #out th, #out td { border: 1px solid #c9d1e2; padding: 6px 12px; }
  #out th { background: #eef2fa; }
  #out hr { border: 0; border-top: 2px solid #d8deea; margin: 1.4em 0; }
  #out img { max-width: 100%; }
  #out a { color: #1769d6; }
  .hint { margin-top: 12px; font-size: 12px; color: var(--muted); line-height: 1.7; }
  .tools { display: flex; gap: 6px; flex-wrap: wrap; }
  .box.drag { outline: 3px dashed var(--accent); outline-offset: -3px; }
  .box.drag textarea { background: #14263a; }
  .msg { padding: 6px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); }
  .msg:empty { display: none; }
  @media print {
    @page { margin: 15mm; }
    body { background: #fff; color: #000; padding: 0; max-width: none; }
    .back, body > h1, .lead, .chips, .hint, .cols > .box:first-child, .msg, .box > .hd, #src { display: none !important; }
    .cols { display: block; }
    .box { display: block; background: none; border: 0; overflow: visible; }
    #out { display: block !important; height: auto; min-height: 0; overflow: visible; padding: 0; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    #out pre { background: #f4f6fa; color: #1d2433; border: 1px solid #c9d1e2; white-space: pre-wrap; overflow: visible; }
    #out h1, #out h2, #out h3, #out h4, #out h5, #out h6 { break-after: avoid; }
    #out pre, #out tr, #out img, #out blockquote { break-inside: avoid; }
  }
</style>
</head>
<body>
<a class="back" href="../">← LAB 一覧</a>
<h1>Markdown 体験</h1>
<p class="lead">左の欄に書くと、右にどう見えるかがすぐ出ます。ファイルは、左の欄にドロップするか「開く」で読み込めます。HTML のタグも使えます。下の見本を押すと、その書き方の例が入ります。自由に書き換えて試してください。</p>
<div class="chips" id="chips"></div>

<div class="cols">
  <div class="box">
    <div class="hd"><span>書く（Markdown）</span><span class="tools"><button id="open" type="button" title="Markdown / HTML / テキストのファイルを読み込みます">📂 開く</button><button id="clear" type="button">全部消す</button></span></div>
    <input type="file" id="file" accept=".md,.markdown,.txt,.html,.htm,text/markdown,text/plain,text/html" hidden>
    <textarea id="md" spellcheck="false" aria-label="Markdown を入力" placeholder="ここに書きます。ファイルをドロップしても読み込めます。"></textarea>
    <div class="msg" id="msg" role="status"></div>
  </div>
  <div class="box">
    <div class="hd"><span>結果</span>
      <span class="tabs"><button type="button" id="tPrev" class="on">見た目</button><button type="button" id="tSrc">HTML</button><button type="button" id="print" title="結果の見た目を印刷します（PDF保存もできます）">🖨 印刷</button></span>
    </div>
    <div id="out" aria-live="polite"></div>
    <pre id="src"></pre>
  </div>
</div>
<p class="hint">ブラウザの中だけで動きます。書いた内容は送信されません（この端末のブラウザに自動で保存します）。</p>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const md = $('md'), out = $('out'), src = $('src');

const SAMPLES = {
  '見出し': '# 大見出し\n## 中見出し\n### 小見出し\n\n「#」の数が増えるほど、見出しは小さくなります。\n「#」のあとには半角スペースを入れます。\n',
  '強調': 'ふつうの文章の中で、**太字**にしたり、*斜体*にしたり、~~取り消し線~~を引いたりできます。\n\n`コード`のように、等幅の文字にもできます。\n',
  'リスト': '- りんご\n- みかん\n  - 温州みかん\n  - デコポン\n- ぶどう\n\n1. 材料を切る\n2. 煮る\n3. 味つけする\n\n- [x] 終わったこと\n- [ ] これからやること\n',
  'リンク・画像': '[Anthropic のサイト](https://www.anthropic.com/)\n\n画像は先頭に「!」を付けます:\n\n![代わりの文字](https://example.com/sample.png)\n',
  '引用': '> 引用は「>」で始めます。\n> 何行でも続けられます。\n>\n> > 引用の中の引用もできます。\n',
  'コード': '文中は `print("hello")` のように書きます。\n\n複数行は、3つのバッククォートで囲みます:\n\n```python\ndef add(a, b):\n    return a + b\n\nprint(add(2, 3))\n```\n',
  '表': '| 名前 | 点数 | 判定 |\n|------|-----:|:----:|\n| 太郎 | 80 | 合格 |\n| 花子 | 95 | 合格 |\n| 次郎 | 42 | 不合格 |\n\n2行目の「:」で、文字の寄せ方を決められます。\n',
  '区切り線': '上の段落\n\n---\n\n下の段落\n\n「---」だけの行が、横線になります。\n',
  '全部のせ': '# Markdown とは\n\n**Markdown** は、記号だけで見た目を決める書き方です。\n\n## できること\n\n- 見出し\n- *強調* と **太字**\n- [リンク](https://example.com/)\n\n> 書くのが速く、読むのも楽です。\n\n```js\nconsole.log("Hello");\n```\n\n| 記号 | 意味 |\n|---|---|\n| `#` | 見出し |\n| `-` | リスト |\n'
};

const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const safeUrl = u => /^(https?:|mailto:|#|\/|\.\/|\.\.\/|data:image\/)/i.test(u.trim()) ? u.trim() : '#';
const NUL = String.fromCharCode(0);

function inline(s) {
  const codes = [];
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (_, __, c) => { codes.push('<code>' + esc(c.trim()) + '</code>'); return NUL + (codes.length - 1) + NUL; });
  s = s.replace(/<(https?:\/\/[^\s<>]+)>/g, (_, u) => { codes.push('<a href="' + esc(u) + '">' + esc(u) + '</a>'); return NUL + (codes.length - 1) + NUL; });
  s = s.replace(/<\/?[A-Za-z][A-Za-z0-9-]*(?:\s[^<>]*)?\/?>|<!--[\s\S]*?-->/g, t => { codes.push(t); return NUL + (codes.length - 1) + NUL; });
  s = esc(s);
  s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (_, a, u, t) => '<img src="' + esc(safeUrl(u.replace(/&amp;/g, '&'))) + '" alt="' + a + '"' + (t ? ' title="' + t + '"' : '') + '>');
  s = s.replace(/\[([^\]]+)\]\(([^)\s]+)(?:\s+&quot;([^&]*)&quot;)?\)/g, (_, a, u, t) => '<a href="' + esc(safeUrl(u.replace(/&amp;/g, '&'))) + '" target="_blank" rel="noopener noreferrer">' + a + '</a>');
  s = s.replace(/\*\*\*([^*]+)\*\*\*/g, '<strong><em>$1</em></strong>').replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>').replace(/__([^_]+)__/g, '<strong>$1</strong>')
       .replace(/\*([^*\s][^*]*)\*/g, '<em>$1</em>').replace(/(^|[\s(])_([^_]+)_(?=$|[\s).,!?])/g, '$1<em>$2</em>').replace(/~~([^~]+)~~/g, '<del>$1</del>');
  s = s.replace(/(^|[^"=>])(https?:\/\/[^\s<]+[^\s<.,;:!?)])/g, '$1<a href="$2" target="_blank" rel="noopener noreferrer">$2</a>');
  return s.split(NUL).map((p, k) => (k % 2 ? codes[+p] : p)).join('');
}

const BLOCK = /^\s*<(?:!--|!doctype|\/?(?:address|article|aside|blockquote|body|caption|center|col|colgroup|dd|details|dialog|div|dl|dt|fieldset|figcaption|figure|footer|form|h[1-6]|head|header|hr|html|li|main|meta|link|nav|ol|p|pre|script|section|style|summary|table|tbody|td|tfoot|th|thead|title|tr|ul|iframe)(?=[\s\/>]|$))/i;

/* 危ないもの（スクリプトやイベント属性など）を取り除いてから表示する */
const DROP = /^(script|style|iframe|frame|frameset|object|embed|applet|form|input|button|select|textarea|meta|link|base|title|head|svg|math|template|noscript|audio|video|source)$/;
const KEEP = /^(a|abbr|address|article|aside|b|bdi|bdo|big|blockquote|br|caption|center|cite|code|col|colgroup|dd|del|details|dfn|div|dl|dt|em|figcaption|figure|font|footer|h[1-6]|header|hr|i|img|ins|kbd|li|main|mark|nav|ol|p|pre|q|rp|rt|ruby|s|samp|section|small|span|strike|strong|sub|summary|sup|table|tbody|td|tfoot|th|thead|time|tr|tt|u|ul|var|wbr)$/;
const ATTR = /^(align|valign|colspan|rowspan|width|height|alt|title|href|src|open|start|reversed|color|size|face|bgcolor|border|cellpadding|cellspacing|lang|dir|style|class)$/;
const CSSOK = /^(color|background-color|text-align|text-decoration[a-z-]*|text-indent|font(-size|-weight|-style|-family)?|line-height|letter-spacing|vertical-align|white-space[a-z-]*|width|height|max-width|min-width|margin(-top|-right|-bottom|-left)?|padding(-top|-right|-bottom|-left)?|border(-[a-z]+)*|list-style(-type)?|float|clear|display)$/;
let removed = 0;
function sanitize(html) {
  removed = 0;
  const doc = new DOMParser().parseFromString('<!doctype html><body>' + html, 'text/html');
  const walk = node => {
    Array.from(node.childNodes).forEach(c => {
      if (c.nodeType === 8) { c.remove(); return; }
      if (c.nodeType !== 1) return;
      const tag = c.localName;
      if (DROP.test(tag)) {
        if (tag === 'input' && c.type === 'checkbox') { c.replaceWith(c.checked ? '☑' : '☐'); return; }
        if (!/^(meta|title|head|style|link|base)$/.test(tag)) removed++;
        c.remove(); return;
      }
      walk(c);
      if (!KEEP.test(tag)) { c.replaceWith(...c.childNodes); return; }
      Array.from(c.attributes).forEach(a => {
        const n = a.name.toLowerCase();
        if (!ATTR.test(n)) { if (n.startsWith('on')) removed++; c.removeAttribute(a.name); return; }
        // javascript: などは無効化（相対パス、http(s)、mailto は残す）
        if (n === 'href' || n === 'src') {
          const v = a.value.replace(/[\u0000-\u0020]/g, '');
          if (/^[a-z][a-z0-9+.-]*:/i.test(v) && !/^(https?:|mailto:|tel:|data:image\/)/i.test(v)) { removed++; c.setAttribute(a.name, '#'); }
        }
        if (n === 'class' && !/^(task|lang-[\w+-]+)$/.test(a.value)) c.removeAttribute(a.name);
        if (n === 'style') {
          const st = Array.from(c.style).filter(k => CSSOK.test(k) && !/url\(|expression/i.test(c.style.getPropertyValue(k))).map(k => k + ':' + c.style.getPropertyValue(k));
          if (st.length) c.setAttribute('style', st.join(';')); else c.removeAttribute('style');
        }
      });
      if (tag === 'a' && c.hasAttribute('href')) { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener noreferrer'); }
    });
  };
  walk(doc.body);
  return doc.body.innerHTML.trim();
}

function render(text) {
  const L = text.replace(/\r\n?/g, '\n').split('\n'), o = [];
  let i = 0;
  const isBlank = l => /^\s*$/.test(l);
  const isHr = l => /^\s*([-*_])(\s*\1){2,}\s*$/.test(l);
  const isLi = l => /^\s*([-*+]|\d+[.)])\s/.test(l);
  const startsBlock = l => BLOCK.test(l) || /^(#{1,6})\s/.test(l) || /^\s*(```|~~~)/.test(l) || /^\s*>/.test(l) || isLi(l) || isHr(l);
  while (i < L.length) {
    const l = L[i];
    if (isBlank(l)) { i++; continue; }
    let m;
    if (BLOCK.test(l)) {
      // HTML のかたまりは、そのまま通す（空行まで。script・style・pre・コメントは閉じるまで）
      m = l.match(/^\s*<(script|style|pre)\b/i);
      const buf = [], end = m ? new RegExp('</' + m[1] + '\\s*>', 'i') : /^\s*<!--/.test(l) ? /-->/ : null;
      if (end) { while (i < L.length) { buf.push(L[i]); if (end.test(L[i++])) break; } }
      else { while (i < L.length && !isBlank(L[i])) buf.push(L[i++]); }
      o.push(buf.join('\n')); continue;
    }
    if ((m = l.match(/^\s*(```|~~~)\s*([\w+-]*)/))) {
      const fence = m[1], buf = []; i++;
      while (i < L.length && !L[i].trim().startsWith(fence)) buf.push(L[i++]);
      i++; o.push('<pre><code' + (m[2] ? ' class="lang-' + esc(m[2]) + '"' : '') + '>' + esc(buf.join('\n')) + '</code></pre>'); continue;
    }
    if ((m = l.match(/^(#{1,6})\s+(.*?)\s*#*\s*$/))) { o.push('<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'); i++; continue; }
    if (isHr(l)) { o.push('<hr>'); i++; continue; }
    if (/^\s*>/.test(l)) {
      const buf = []; while (i < L.length && /^\s*>/.test(L[i])) buf.push(L[i++].replace(/^\s*>\s?/, ''));
      o.push('<blockquote>' + render(buf.join('\n')) + '</blockquote>'); continue;
    }
    if (l.includes('|') && i + 1 < L.length && L[i + 1].includes('-') && /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/.test(L[i + 1])) {
      const cells = r => r.trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(c => c.trim());
      const al = cells(L[i + 1]).map(c => c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : c.startsWith(':') ? 'left' : '');
      const st = k => al[k] ? ' style="text-align:' + al[k] + '"' : '';
      let h = '<table><thead><tr>' + cells(l).map((c, k) => '<th' + st(k) + '>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>';
      i += 2;
      while (i < L.length && !isBlank(L[i]) && L[i].includes('|')) { h += '<tr>' + cells(L[i]).map((c, k) => '<td' + st(k) + '>' + inline(c) + '</td>').join('') + '</tr>'; i++; }
      o.push(h + '</tbody></table>'); continue;
    }
    if (isLi(l)) {
      const items = [];
      while (i < L.length && !isBlank(L[i]) && isLi(L[i])) {
        const mm = L[i].match(/^(\s*)([-*+]|\d+[.)])\s+(.*)$/); items.push({ d: mm[1].replace(/\t/g, '  ').length, ol: /\d/.test(mm[2]), t: mm[3] }); i++;
      }
      const build = (from, depth) => {
        let h = '<' + (items[from].ol ? 'ol' : 'ul') + '>', k = from;
        const tag = items[from].ol ? 'ol' : 'ul';
        while (k < items.length && items[k].d >= depth) {
          if (items[k].d > depth) { const r = build(k, items[k].d); h = h.replace(/<\/li>$/, '') + r.h + '</li>'; k = r.k; continue; }
          let t = items[k].t, cls = '';
          const tk = t.match(/^\[([ xX])\]\s+(.*)$/); if (tk) { t = (/x/i.test(tk[1]) ? '☑ ' : '☐ ') + tk[2]; cls = ' class="task"'; }
          h += '<li' + cls + '>' + inline(t) + '</li>'; k++;
        }
        return { h: h + '</' + tag + '>', k };
      };
      let k = 0; while (k < items.length) { const r = build(k, items[k].d); o.push(r.h); k = r.k; }
      continue;
    }
    const buf = [l]; i++;
    while (i < L.length && !isBlank(L[i]) && !startsBlock(L[i])) buf.push(L[i++]);
    o.push('<p>' + buf.map(x => inline(x.trim())).join('<br>') + '</p>');
  }
  return o.join('\n');
}

let loaded = '', loadedText = null;
function update() {
  let h; try { h = sanitize(/^\s*(<!doctype html|<html[\s>])/i.test(md.value) ? md.value : render(md.value)); } catch (e) { h = '<p>表示できませんでした: ' + esc(String(e)) + '</p>'; }
  out.innerHTML = h || '<p style="color:#8a93a8">ここに結果が出ます。</p>';
  src.textContent = h;
  $('msg').textContent = [loaded, removed ? '安全のため、スクリプトなど ' + removed + ' 件は表示していません。' : ''].filter(Boolean).join(' ');
  try { localStorage.setItem('lab-md', md.value); } catch (e) {}
}
md.addEventListener('input', update);
$('tPrev').onclick = () => { out.style.display = ''; src.style.display = 'none'; $('tPrev').classList.add('on'); $('tSrc').classList.remove('on'); };
$('tSrc').onclick = () => { out.style.display = 'none'; src.style.display = 'block'; $('tSrc').classList.add('on'); $('tPrev').classList.remove('on'); };
$('print').onclick = () => window.print();
async function readFile(f) {
  if (!f) return;
  if (!/\.(md|markdown|txt|html?)$/i.test(f.name) && !/^text\//.test(f.type)) { $('msg').textContent = '読み込めるのは、Markdown（.md）、HTML、テキストのファイルです。'; return; }
  if (f.size > 2 * 1024 * 1024) { $('msg').textContent = 'ファイルが大きすぎます（2MB まで）。'; return; }
  const buf = await f.arrayBuffer(), head = new Uint8Array(buf.slice(0, 2));
  let text;
  if (head[0] === 0xFF && head[1] === 0xFE) text = new TextDecoder('utf-16le').decode(buf);
  else { try { text = new TextDecoder('utf-8', { fatal: true }).decode(buf); } catch (e) { text = new TextDecoder('shift_jis').decode(buf); } }
  const cur = md.value;
  if (cur.trim() && cur !== loadedText && !Object.values(SAMPLES).includes(cur) && !confirm('いま書いている内容は、読み込むファイルに置きかわります。よろしいですか？')) return;
  md.value = text.replace(/\r\n?/g, '\n'); loadedText = md.value; loaded = '「' + f.name + '」を読み込みました。';
  update(); md.scrollTop = 0; out.scrollTop = 0;
}
$('open').onclick = () => $('file').click();
$('file').onchange = () => { readFile($('file').files[0]); $('file').value = ''; };
const leftBox = md.closest('.box');
const hasFiles = e => e.dataTransfer && Array.from(e.dataTransfer.types).includes('Files');
let depth = 0;
leftBox.addEventListener('dragenter', e => { if (hasFiles(e)) { e.preventDefault(); depth++; leftBox.classList.add('drag'); } });
leftBox.addEventListener('dragleave', e => { if (hasFiles(e) && depth > 0 && --depth === 0) leftBox.classList.remove('drag'); });
// 欄の外に落としても、ブラウザがファイルを開いて画面が切りかわらないようにする
window.addEventListener('dragover', e => { if (hasFiles(e)) { e.preventDefault(); e.dataTransfer.dropEffect = leftBox.contains(e.target) ? 'copy' : 'none'; } });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); depth = 0; leftBox.classList.remove('drag');
  if (leftBox.contains(e.target)) readFile(e.dataTransfer.files[0]);
});
$('clear').onclick = () => { loaded = ''; md.value = ''; update(); md.focus(); };
md.addEventListener('keydown', e => { if (e.key === 'Tab') { e.preventDefault(); md.setRangeText('  ', md.selectionStart, md.selectionEnd, 'end'); update(); } });
Object.keys(SAMPLES).forEach(k => {
  const b = document.createElement('button'); b.type = 'button'; b.textContent = k;
  b.onclick = () => { loaded = ''; md.value = SAMPLES[k]; update(); md.focus(); };
  $('chips').appendChild(b);
});
let init = ''; try { init = localStorage.getItem('lab-md') || ''; } catch (e) {}
md.value = init || SAMPLES['全部のせ'];
update();
})();
</script>
</body>
</html>
