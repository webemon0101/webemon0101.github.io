<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ムンカー錯視メーカー</title>
<style>
  :root{--bg:#12141a;--panel:#1c1f29;--line:#2c3040;--fg:#e8eaf0;--sub:#9aa0b4;--acc:#ff7ac6;--acc2:#e85fae;--err:#ff6b6b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.5}
  main{max-width:900px;margin:0 auto;padding:24px 16px 56px}
  h1{font-size:1.5rem;margin:0 0 4px}
  h2{font-size:1rem;margin:0 0 12px}
  .lead{color:var(--sub);margin:0 0 20px;font-size:.92rem}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
  label{display:block;font-size:.82rem;color:var(--sub);margin-bottom:4px}
  select,input[type=file]{width:100%;background:#12141a;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 10px;font-size:.95rem;font-family:inherit}
  input[type=color]{width:100%;height:42px;background:#12141a;border:1px solid var(--line);border-radius:8px;padding:3px;cursor:pointer}
  input[type=range]{width:100%}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:16px}
  button,a.btn{background:var(--acc);color:#2a0a1c;font-weight:700;border:0;border-radius:8px;padding:10px 20px;font-size:1rem;cursor:pointer;text-decoration:none;display:inline-block}
  button:hover,a.btn:hover{background:var(--acc2)}
  button.sec{background:#2c3040;color:var(--fg);font-weight:400}button.sec:hover{background:#383d52}
  button:disabled{opacity:.5;cursor:default}
  canvas{display:block;background:#000;border-radius:8px;max-width:100%;max-height:80vh}
  .stage{display:flex;justify-content:center}
  .bar{height:8px;background:#12141a;border-radius:6px;overflow:hidden;margin-top:12px}
  .bar i{display:block;height:100%;width:0;background:var(--acc)}
  #status{color:var(--sub);font-size:.88rem;margin-top:8px;min-height:1.3em}
  .info{color:var(--sub);font-size:.85rem;margin-top:10px}
  .err{color:var(--err)}
  .hidden{display:none}
  .back{color:var(--sub);font-size:.85rem;text-decoration:none}
</style>
</head>
<body>
<main>
  <p style="margin:0 0 8px"><a class="back" href="../">← UTIL 一覧</a></p>
  <h1>ムンカー錯視メーカー</h1>
  <p class="lead">背景は2つの画面（横長・正方形は左右、縦長は上下）とも同じ2色の縞。中の形だけ、左（上）は片方の色の縞を、右（下）はもう片方の色の縞を「同じ色」に置き換えます。すると同じ色の形が、2つの画面で違う色に見えます。問いかけ → 縞を消す → 並べて種明かしの動画にします。</p>

  <section class="panel">
    <h2>色</h2>
    <div class="grid">
      <div><label>おすすめ配色</label>
        <select id="preset">
          <option value="skull">赤いガイコツ（紺 / 黄 → 紫 / オレンジに見える）</option>
          <option value="pink">ピンク / 水色（灰色の形）</option>
          <option value="red">赤 / 青（灰色の形）</option>
          <option value="orange">オレンジ / 緑（灰色の形）</option>
          <option value="yellow">黄 / 紫（灰色の形）</option>
          <option value="custom">カスタム</option>
        </select></div>
      <div><label>背景の縞の色A（左の形に残る色）</label><input id="c1" type="color" value="#0b4d90"></div>
      <div><label>背景の縞の色B（右の形に残る色）</label><input id="c2" type="color" value="#ffe81a"></div>
      <div><label>中央の形の色（2つの画面で共通）</label><input id="c0" type="color" value="#d71e24"></div>
    </div>
    <div class="row" style="margin-top:12px"><button id="rand" type="button" class="sec">🎲 ランダム配色</button></div>

    <h2 style="margin-top:20px">形</h2>
    <div class="grid">
      <div><label>中央の形</label>
        <select id="shape"><option value="skull">ガイコツ</option><option value="rect">四角</option><option value="circle">円</option><option value="img">自分の画像・動画（単色に塗りつぶします）</option></select></div>
      <div id="imgBox" class="hidden"><label>画像または動画（ロゴ・イラスト・シルエット・ダンス動画など）</label><input id="shapeImg" type="file" accept="image/*,video/*"></div>
      <div id="modeBox" class="hidden"><label>画像から形を取り出す方法</label>
        <select id="mode">
          <option value="auto">自動（透過 or 背景色を除去）</option>
          <option value="dark">暗い部分を形にする</option>
          <option value="light">明るい部分を形にする</option>
          <option value="motion">動いている部分（動画のみ・カメラ固定向け）</option>
        </select></div>
      <div id="thrBox" class="hidden"><label>動き検出の感度（小さいほど敏感）: <span id="thv">40</span></label><input id="thr" type="range" min="10" max="120" step="5" value="40"></div>
    </div>

    <div class="grid" style="margin-top:14px">
      <div><label>形の大きさ: <span id="zsv">100</span> %</label><input id="zs" type="range" min="30" max="300" step="5" value="100"></div>
      <div><label>横位置: <span id="dxv">0</span></label><input id="dx" type="range" min="-50" max="50" step="1" value="0"></div>
      <div><label>縦位置: <span id="dyv">0</span></label><input id="dy" type="range" min="-50" max="50" step="1" value="0"></div>
    </div>
    <div class="row" style="margin-top:8px"><button id="resetXf" type="button" class="sec">形の大きさ・位置をリセット</button></div>

    <h2 style="margin-top:20px">縞・画面</h2>
    <div class="grid">
      <div><label>種明かしの方法</label>
        <select id="reveal">
          <option value="erase">縞を消す</option>
          <option value="zoom">近づいてみる（同じ部分にズーム）</option>
        </select></div>
      <div><label>最後の並べ方</label>
        <select id="arrange">
          <option value="side">左右にぴったり並べる</option>
          <option value="stack">上下にぴったり並べる</option>
          <option value="overlap">完全に重ねる</option>
        </select></div>
      <div><label>縞の向き</label>
        <select id="orient"><option value="v">縦縞</option><option value="h">横縞</option></select></div>
      <div><label>縞の細かさ（組数）: <span id="nv">22</span></label><input id="count" type="range" min="8" max="50" step="1" value="22"></div>
      <div><label>画面の比率</label>
        <select id="aspect">
          <option value="9:16">縦長 9:16（Shorts / TikTok）720×1280</option>
          <option value="16:9">横長 16:9（YouTube）1280×720</option>
          <option value="1:1">正方形 1:1　900×900</option>
        </select></div>
    </div>
    <div class="info">縞が細いほど、また画面を小さく（離れて）見るほど、形が縞の色に染まって見えます。</div>

    <div class="row">
      <button id="play" type="button">▶ プレビュー再生</button>
      <button id="stop" type="button" class="sec hidden">■ 停止</button>
      <button id="rec" type="button" class="sec">⏺ 動画として保存</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div id="status"></div>
  </section>

  <section class="panel">
    <div class="stage"><canvas id="cv"></canvas></div>
    <div id="result" class="row hidden" style="justify-content:center">
      <a id="dl" class="btn" download="munker.webm">動画をダウンロード</a>
    </div>
    <div class="info">動画の保存はリアルタイムで録画します（動画の長さ＝保存にかかる時間）。録画中はこのタブを表示したままにしてください。</div>
  </section>
</main>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const SIZES = { '16:9': [1280, 720], '9:16': [720, 1280], '1:1': [900, 900] };
const GRAY = '#a0a0a0';
const PRESETS = {
  skull: { c: ['#0b4d90', '#ffe81a'], t: '#d71e24', shape: 'skull' },
  pink: { c: ['#ff2a8a', '#00b7ff'], t: GRAY },
  red: { c: ['#ff2020', '#2040ff'], t: GRAY },
  orange: { c: ['#ff9a00', '#12c24a'], t: GRAY },
  yellow: { c: ['#ffe600', '#8a2be2'], t: GRAY }
};
let L = null, timeline = [], total = 0, timer = 0, shapeImg = null, shapeVid = null;
let raf = 0, startAt = 0, onEnd = null, recorder = null, outUrl = null;

function setStatus(t, err) { const s = $('status'); s.textContent = t; s.classList.toggle('err', !!err); }
const ease = p => p <= 0 ? 0 : p >= 1 ? 1 : p * p * (3 - 2 * p);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };

/* ---------- Shapes (white alpha masks, pz x pz) ---------- */
function skullMask(pz) {
  const c = mk(pz, pz), g = c.getContext('2d'), u = pz;
  g.fillStyle = '#fff';
  g.beginPath(); g.ellipse(u * 0.5, u * 0.4, u * 0.37, u * 0.35, 0, 0, 7); g.fill();
  g.beginPath(); g.roundRect(u * 0.28, u * 0.58, u * 0.44, u * 0.32, u * 0.07); g.fill();
  g.beginPath(); g.roundRect(u * 0.2, u * 0.5, u * 0.6, u * 0.16, u * 0.08); g.fill();
  g.globalCompositeOperation = 'destination-out';
  [0.355, 0.645].forEach(x => { g.beginPath(); g.ellipse(u * x, u * 0.43, u * 0.1, u * 0.115, 0, 0, 7); g.fill(); });
  g.beginPath(); g.moveTo(u * 0.5, u * 0.52); g.lineTo(u * 0.455, u * 0.62); g.lineTo(u * 0.545, u * 0.62); g.closePath(); g.fill();
  g.lineWidth = u * 0.018; g.strokeStyle = '#000';
  for (let i = 1; i < 5; i++) { const x = u * (0.34 + i * 0.064); g.beginPath(); g.moveTo(x, u * 0.74); g.lineTo(x, u * 0.9); g.stroke(); }
  g.beginPath(); g.moveTo(u * 0.3, u * 0.75); g.lineTo(u * 0.7, u * 0.75); g.stroke();
  return c;
}
/* ---------- Motion extraction (moving parts of a video, static camera) ---------- */
let videoBg = null;
const seekTo = (v, t) => new Promise(res => {
  let done = false;
  const f = () => { if (done) return; done = true; v.removeEventListener('seeked', f); clearTimeout(to); res(); };
  const to = setTimeout(f, 3000);
  v.addEventListener('seeked', f);
  v.currentTime = Math.max(0, Math.min(t, v.duration - 0.05));
});
async function ensureBg() {     // per-pixel median of frames sampled across the video = background
  const v = shapeVid;
  if (!v || (videoBg && videoBg.src === v.src)) return;
  setStatus('背景を解析中…（少し時間がかかります）');
  const iw = v.videoWidth, ih = v.videoHeight, sc = Math.min(1, 256 / Math.max(iw, ih));
  const w = Math.max(1, Math.round(iw * sc)), h = Math.max(1, Math.round(ih * sc)), N = 11;
  const c = mk(w, h), g = c.getContext('2d', { willReadFrequently: true }), frames = [];
  for (let i = 0; i < N; i++) {
    await seekTo(v, v.duration * (i + 0.5) / N);
    g.drawImage(v, 0, 0, w, h);
    frames.push(g.getImageData(0, 0, w, h).data.slice());
  }
  const data = new Uint8ClampedArray(w * h * 4), tmp = new Uint8Array(N);
  for (let i = 0; i < data.length; i++) {
    if (i % 4 === 3) { data[i] = 255; continue; }
    for (let j = 0; j < N; j++) tmp[j] = frames[j][i];
    tmp.sort(); data[i] = tmp[N >> 1];
  }
  videoBg = { w, h, data, src: v.src };
  v.currentTime = 0;
  setStatus('');
}
function morph(a, w, h, dilate) {
  const o = new Uint8Array(a.length);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    let v = dilate ? 0 : 1;
    for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx < 0 || yy < 0 || xx >= w || yy >= h) continue;
      if (dilate) v |= a[yy * w + xx]; else v &= a[yy * w + xx];
    }
    o[y * w + x] = v;
  }
  return o;
}
function motionAlpha(d, w, h, alpha) {
  const bg = videoBg.data, thr = +$('thr').value, n = w * h;
  let a = new Uint8Array(n);
  for (let p = 0; p < n; p++) {
    const i = p * 4;
    a[p] = Math.max(Math.abs(d[i] - bg[i]), Math.abs(d[i + 1] - bg[i + 1]), Math.abs(d[i + 2] - bg[i + 2])) > thr ? 1 : 0;
  }
  a = morph(morph(a, w, h, false), w, h, true);    // opening: drop speckle noise
  a = morph(morph(a, w, h, true), w, h, false);    // closing: join gaps
  // fill holes: flood the outside from the border, everything not reached is inside
  const seen = new Uint8Array(n), stack = new Int32Array(n);
  let sp = 0;
  const push = p => { if (!seen[p] && !a[p]) { seen[p] = 1; stack[sp++] = p; } };
  for (let x = 0; x < w; x++) { push(x); push((h - 1) * w + x); }
  for (let y = 0; y < h; y++) { push(y * w); push(y * w + w - 1); }
  while (sp) {
    const p = stack[--sp], x = p % w, y = (p / w) | 0;
    if (x > 0) push(p - 1); if (x < w - 1) push(p + 1); if (y > 0) push(p - w); if (y < h - 1) push(p + w);
  }
  // keep only the largest connected blob
  const lab = new Int32Array(n);
  let id = 0, best = 0, bestN = 0;
  for (let s = 0; s < n; s++) {
    if (seen[s] || lab[s]) continue;
    id++; let cnt = 0; sp = 0; stack[sp++] = s; lab[s] = id;
    while (sp) {
      const p = stack[--sp]; cnt++;
      const x = p % w, y = (p / w) | 0;
      const nb = [x > 0 ? p - 1 : -1, x < w - 1 ? p + 1 : -1, y > 0 ? p - w : -1, y < h - 1 ? p + w : -1];
      for (const q of nb) if (q >= 0 && !seen[q] && !lab[q]) { lab[q] = id; stack[sp++] = q; }
    }
    if (cnt > bestN) { bestN = cnt; best = id; }
  }
  for (let p = 0; p < n; p++) alpha[p] = lab[p] === best ? 255 : 0;
}
function maskCanvas(im, pz, mode, maxDim = 800) {
  const iw = im.naturalWidth || im.videoWidth, ih = im.naturalHeight || im.videoHeight;
  const sc = Math.min(1, maxDim / Math.max(iw, ih));
  const w = Math.max(1, Math.round(iw * sc)), h = Math.max(1, Math.round(ih * sc));
  const c = mk(w, h), g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(im, 0, 0, w, h);
  const d = g.getImageData(0, 0, w, h).data, at = (x, y) => (y * w + x) * 4;
  const alpha = new Uint8Array(w * h);
  const corners = [at(0, 0), at(w - 1, 0), at(0, h - 1), at(w - 1, h - 1)];
  const hasAlpha = corners.some(i => d[i + 3] < 200);
  const isVid = !!im.videoWidth && !im.naturalWidth;
  if (mode === 'motion' && !(isVid && videoBg && videoBg.w === w && videoBg.h === h)) mode = 'auto';
  if (mode === 'motion') {
    motionAlpha(d, w, h, alpha);
  } else if (mode === 'auto') {
    if (hasAlpha) { for (let p = 0; p < w * h; p++) alpha[p] = d[p * 4 + 3]; }
    else {
      const bg = [0, 1, 2].map(k => corners.reduce((s, i) => s + d[i + k], 0) / 4);
      const near = p => Math.hypot(d[p * 4] - bg[0], d[p * 4 + 1] - bg[1], d[p * 4 + 2] - bg[2]) <= 48;
      const seen = new Uint8Array(w * h), stack = new Int32Array(w * h);
      let sp = 0;
      const push = (x, y) => { const p = y * w + x; if (!seen[p] && near(p)) { seen[p] = 1; stack[sp++] = p; } };
      for (let x = 0; x < w; x++) { push(x, 0); push(x, h - 1); }
      for (let y = 0; y < h; y++) { push(0, y); push(w - 1, y); }
      while (sp) {
        const p = stack[--sp], x = p % w, y = (p / w) | 0;
        if (x > 0) push(x - 1, y); if (x < w - 1) push(x + 1, y);
        if (y > 0) push(x, y - 1); if (y < h - 1) push(x, y + 1);
      }
      for (let p = 0; p < w * h; p++) alpha[p] = seen[p] ? 0 : 255;
    }
  } else {
    for (let p = 0; p < w * h; p++) {
      const lum = 0.299 * d[p * 4] + 0.587 * d[p * 4 + 1] + 0.114 * d[p * 4 + 2];
      const v = mode === 'dark' ? (150 - lum) * 255 / 40 : (lum - 105) * 255 / 40;
      alpha[p] = Math.max(0, Math.min(255, v)) * d[p * 4 + 3] / 255;
    }
  }
  let x0 = w, y0 = h, x1 = -1, y1 = -1;
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) if (alpha[y * w + x] > 30) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  if (x1 < 0 || isVid) { x0 = 0; y0 = 0; x1 = w - 1; y1 = h - 1; }   // video: keep the whole frame fixed (no per-frame re-fit)
  const bw = x1 - x0 + 1, bh = y1 - y0 + 1;
  const m = mk(bw, bh), mg = m.getContext('2d'), md = mg.createImageData(bw, bh);
  for (let y = 0; y < bh; y++) for (let x = 0; x < bw; x++) {
    const i = (y * bw + x) * 4; md.data[i] = md.data[i + 1] = md.data[i + 2] = 255; md.data[i + 3] = alpha[(y + y0) * w + x + x0];
  }
  mg.putImageData(md, 0, 0);
  const out = mk(pz, pz), og = out.getContext('2d'), s = Math.min(pz / bw, pz / bh);
  og.imageSmoothingQuality = 'high';
  og.drawImage(m, (pz - bw * s) / 2, (pz - bh * s) / 2, bw * s, bh * s);
  return out;
}
function shapeMask(pz) {
  const kind = $('shape').value;
  if (kind === 'skull') return skullMask(pz);
  if (kind === 'img' && shapeVid && shapeVid.readyState >= 2) return maskCanvas(shapeVid, pz, $('mode').value, 256);
  if (kind === 'img' && shapeImg) return maskCanvas(shapeImg, pz, $('mode').value);
  const c = mk(pz, pz), g = c.getContext('2d');
  g.fillStyle = '#fff'; g.beginPath();
  if (kind === 'circle') g.arc(pz / 2, pz / 2, pz / 2, 0, 7); else g.rect(0, 0, pz, pz);
  g.fill();
  return c;
}
function tinted(mask, color) {
  const c = mk(mask.width, mask.height), g = c.getContext('2d');
  g.drawImage(mask, 0, 0);
  g.globalCompositeOperation = 'source-in'; g.fillStyle = color; g.fillRect(0, 0, c.width, c.height);
  return c;
}

/* ---------- Build ---------- */
function stripes(ps, n, orient, draw) {   // draw(k, x0, y0, w, h) for each stripe k (0=A, 1=B, ...)
  const half = ps / (2 * n);
  for (let k = 0; k < 2 * n; k++) {
    const a = Math.round(k * half), b = Math.round((k + 1) * half);
    if (orient === 'v') draw(k, a, 0, b - a, ps); else draw(k, 0, a, ps, b - a);
  }
}
function applyShape() {   // (re)compute the shape mask, solid fill and masked stripe overlays
  const { ps, pz, T } = L;
  const z = +$('zs').value / 100, size = Math.max(8, Math.round(pz * z));
  const mask = shapeMask(size);
  const panelMask = mk(ps, ps), pg = panelMask.getContext('2d');
  pg.drawImage(mask, Math.round(ps / 2 + +$('dx').value / 100 * ps - size / 2), Math.round(ps / 2 + +$('dy').value / 100 * ps - size / 2));
  L.solid = tinted(panelMask, T);
  // coarse alpha map: bounding box (for the final arrangement) and a boundary point (for the zoom)
  const G = 96, sm = mk(G, G), sg = sm.getContext('2d', { willReadFrequently: true });
  sg.drawImage(panelMask, 0, 0, G, G);
  const sd = sg.getImageData(0, 0, G, G).data, op = new Uint8Array(G * G);
  let x0 = G, y0 = G, x1 = -1, y1 = -1;
  for (let y = 0; y < G; y++) for (let x = 0; x < G; x++) if (sd[(y * G + x) * 4 + 3] > 100) {
    op[y * G + x] = 1;
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  const k = ps / G;
  L.bb = x1 < 0 ? [0, 0, ps, ps] : [x0 * k, y0 * k, (x1 + 1) * k, (y1 + 1) * k];
  let best = null, bd = 1e9;
  for (let y = 1; y < G - 1; y++) for (let x = 1; x < G - 1; x++) {
    const p = y * G + x;
    if (op[p] && (!op[p - 1] || !op[p + 1] || !op[p - G] || !op[p + G])) {
      const d = (x - G / 2) ** 2 + (y - G / 2) ** 2;
      if (d < bd) { bd = d; best = [(x + 0.5) * k, (y + 0.5) * k]; }
    }
  }
  L.focusPt = best || [ps / 2, ps / 2];
  L.overlay = L.tStripes.map(src => {
    const o = mk(ps, ps), og = o.getContext('2d');
    og.drawImage(src, 0, 0); og.globalCompositeOperation = 'destination-in'; og.drawImage(panelMask, 0, 0);
    return o;
  });
}
function rebuild() {
  const [W, H] = SIZES[$('aspect').value];
  cv.width = W; cv.height = H;
  const vertical = W < H;
  const ps = vertical ? Math.round(Math.min(W * 0.84, H * 0.36)) : Math.round(Math.min(W * 0.44, H * 0.72));
  const pz = Math.round(ps * 0.72);
  const centers = vertical ? [[W / 2, H * 0.31], [W / 2, H * 0.73]] : [[W * 0.27, H * 0.56], [W * 0.73, H * 0.56]];
  const mid = vertical ? [W / 2, H * 0.52] : [W / 2, H * 0.56];
  const A = $('c1').value, B = $('c2').value, T = $('c0').value;
  const n = +$('count').value, orient = $('orient').value;
  // field: both colours everywhere (identical for left & right)
  const field = mk(ps, ps), fg = field.getContext('2d');
  stripes(ps, n, orient, (k, x, y, w, h) => { fg.fillStyle = k % 2 ? B : A; fg.fillRect(x, y, w, h); });
  // shape-colour stripes: left replaces the B stripes, right replaces the A stripes (masked per shape later)
  const tStripes = [1, 0].map(rep => {
    const o = mk(ps, ps), og = o.getContext('2d');
    og.fillStyle = T;
    stripes(ps, n, orient, (k, x, y, w, h) => { if (k % 2 === rep) og.fillRect(x, y, w, h); });
    return o;
  });
  // zoom focus: just inside the top edge of the shape, identical in both panels
  const focus = [ps / 2, ps / 2], Z = Math.max(3, Math.min(10, n / 4));
  L = { W, H, vertical, ps, pz, centers, mid, field, tStripes, T, focus, hex: T.toUpperCase(),
        dynamic: $('shape').value === 'img' && !!shapeVid };
  applyShape();
  L.focus = L.focusPt;   // zoom target: a shape boundary near the centre, identical in both panels
  const noun = $('shape').value === 'skull' ? 'ガイコツ' : '形';
  const q = { dur: 6, f: () => ({ cap: `${vertical ? '上と下' : '左右'}の${noun}は\n同じ色？ 違う色？\n（少し離れて見てみて）`, lines: 1, merge: 0, z: 1 }) };
  const think = { dur: 2, f: () => ({ cap: '答えは…', lines: 1, merge: 0, z: 1 }) };
  const end = [
    { dur: 2.5, f: (t, p) => ({ cap: '並べてみると…', lines: 0, merge: ease(p), z: 1 }) },
    { dur: 4.5, f: () => ({ cap: `完全に同じ色でした！\n${L.hex}`, lines: 0, merge: 1, same: true, z: 1 }) }
  ];
  timeline = $('reveal').value === 'zoom' ? [q, think,
    { dur: 3, f: (t, p) => ({ cap: '近づいてみると…', lines: 1, merge: 0, z: 1 + (Z - 1) * ease(p) }) },
    { dur: 3.5, f: () => ({ cap: `どちらも\n同じ色の縞でした！`, lines: 1, merge: 0, z: Z }) },
    { dur: 2, f: (t, p) => ({ cap: '縞を消して\n全体で見ると…', lines: 1 - ease(p), merge: 0, z: Z - (Z - 1) * ease(p) }) },
    ...end] : [q, think,
    { dur: 3, f: (t, p) => ({ cap: '縞を消して\n本当の色を見ると…', lines: 1 - ease(p), merge: 0, z: 1 }) },
    ...end];
  total = timeline.reduce((a, p) => a + p.dur, 0);
  draw(2);
}

/* ---------- Render ---------- */
function drawText(lines, cx, cy, size, fill) {
  ctx.font = `900 ${size}px "Yu Gothic","Hiragino Sans","Noto Sans JP",sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  const lh = size * 1.35, y0 = cy - lh * (lines.length - 1) / 2;
  lines.forEach((l, i) => {
    ctx.lineWidth = size * 0.2; ctx.strokeStyle = '#000'; ctx.strokeText(l, cx, y0 + i * lh);
    ctx.fillStyle = fill; ctx.fillText(l, cx, y0 + i * lh);
  });
}
function draw(t) {
  if (!L) return;
  if (L.dynamic) applyShape();
  const { W, H, ps, pz, centers, mid, vertical } = L;
  let acc = 0, ph = timeline[0], tl = 0;
  for (const p of timeline) { ph = p; if (t < acc + p.dur) { tl = t - acc; break; } acc += p.dur; tl = p.dur; }
  const s = ph.f(tl, Math.min(1, tl / ph.dur));
  ctx.fillStyle = '#1a1a20'; ctx.fillRect(0, 0, W, H);
  const m = s.merge, lines = s.lines;
  // final arrangement: visible bounding boxes touch (side by side / stacked) or fully overlap
  const bb = L.bb, bw = bb[2] - bb[0], bh = bb[3] - bb[1], bcx = (bb[0] + bb[2]) / 2, bcy = (bb[1] + bb[3]) / 2;
  const arr = $('arrange').value;
  const dv = arr === 'overlap' ? [[0, 0], [0, 0]] : arr === 'stack' ? [[0, -bh / 2], [0, bh / 2]] : [[-bw / 2, 0], [bw / 2, 0]];
  const tg = dv.map(([ox, oy]) => [mid[0] + ox - bcx + ps / 2, mid[1] + oy - bcy + ps / 2]);
  centers.forEach(([cx, cy], i) => {
    const x0 = cx - ps / 2, y0 = cy - ps / 2;
    ctx.save(); ctx.globalAlpha = 1 - m; ctx.fillStyle = '#fff'; ctx.fillRect(x0, y0, ps, ps); ctx.restore();
    ctx.save();
    const zoomed = s.z > 1.0001;
    if (zoomed) {
      ctx.beginPath(); ctx.rect(x0, y0, ps, ps); ctx.clip();
      ctx.translate(cx, cy); ctx.scale(s.z, s.z); ctx.translate(-(x0 + L.focus[0]), -(y0 + L.focus[1]));
      ctx.imageSmoothingEnabled = false;
    }
    if (lines > 0.001) {
      ctx.save(); ctx.globalAlpha = lines;
      ctx.drawImage(L.field, x0, y0); ctx.drawImage(L.overlay[i], x0, y0);
      ctx.restore();
    }
    if (lines < 0.999) {
      const px = cx + (tg[i][0] - cx) * m, py = cy + (tg[i][1] - cy) * m;
      ctx.save(); ctx.globalAlpha = 1 - lines;
      ctx.drawImage(L.solid, px - ps / 2, py - ps / 2); ctx.restore();
    }
    ctx.restore();
  });
  const size = Math.round(Math.min(W, H) * (vertical ? 0.058 : 0.062));
  drawText(s.cap.split('\n'), W / 2, vertical ? H * 0.09 : H * 0.12, size, s.same ? '#ffe600' : '#fff');
}

/* ---------- Controls ---------- */
function applyPreset() {
  const p = PRESETS[$('preset').value];
  if (!p) return;
  $('c1').value = p.c[0]; $('c2').value = p.c[1]; $('c0').value = p.t;
  if (p.shape) $('shape').value = p.shape; else if ($('shape').value === 'skull') $('shape').value = 'rect';
  syncUI();
}
function syncUI() {
  const img = $('shape').value === 'img';
  $('imgBox').classList.toggle('hidden', !img); $('modeBox').classList.toggle('hidden', !img);
  $('thrBox').classList.toggle('hidden', !(img && $('mode').value === 'motion')); $('thv').textContent = $('thr').value;
  $('nv').textContent = $('count').value;
  $('zsv').textContent = $('zs').value; $('dxv').textContent = $('dx').value; $('dyv').textContent = $('dy').value;
}
function schedule() { clearTimeout(timer); timer = setTimeout(() => { stop(); rebuild(); }, 120); }
$('preset').addEventListener('input', () => { applyPreset(); schedule(); });
['c1', 'c2', 'c0'].forEach(i => $(i).addEventListener('input', () => { $('preset').value = 'custom'; schedule(); }));
$('mode').addEventListener('input', async () => { if ($('mode').value === 'motion' && shapeVid) { await ensureBg(); schedule(); } });
$('thr').addEventListener('input', () => { syncUI(); schedule(); });
$('resetXf').onclick = () => { $('zs').value = 100; $('dx').value = 0; $('dy').value = 0; syncUI(); schedule(); };
['shape', 'mode', 'orient', 'count', 'aspect', 'reveal', 'arrange', 'zs', 'dx', 'dy'].forEach(i => $(i).addEventListener('input', () => { syncUI(); schedule(); }));
$('shapeImg').addEventListener('change', e => {
  const f = e.target.files[0];
  shapeImg = null; shapeVid = null;
  if (!f) { schedule(); return; }
  if (f.type.startsWith('video/')) {
    const v = document.createElement('video');
    v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'auto';
    v.onloadeddata = async () => { shapeVid = v; if ($('mode').value === 'motion') await ensureBg(); schedule(); };
    v.onerror = () => setStatus('動画を読み込めませんでした。', true);
    v.src = URL.createObjectURL(f);
    return;
  }
  const im = new Image();
  im.onload = () => { shapeImg = im; schedule(); };
  im.onerror = () => setStatus('画像を読み込めませんでした。', true);
  im.src = URL.createObjectURL(f);
});
$('rand').onclick = () => {
  const h = Math.random() * 360, hx = (hh, s, l) => {
    const a = s * Math.min(l, 1 - l), f = n => { const k = (n + hh / 30) % 12; return Math.round(255 * (l - a * Math.max(-1, Math.min(k - 3, 9 - k, 1)))).toString(16).padStart(2, '0'); };
    return '#' + f(0) + f(8) + f(4);
  };
  $('c1').value = hx(h, 1, 0.4); $('c2').value = hx((h + 150 + Math.random() * 60) % 360, 1, 0.6);
  $('preset').value = 'custom'; schedule();
};

/* ---------- Playback / recording ---------- */
function start(cb) {
  stop();
  onEnd = cb;
  $('play').classList.add('hidden'); $('stop').classList.remove('hidden');
  if (L && L.dynamic) { shapeVid.currentTime = 0; shapeVid.play().catch(() => {}); }
  startAt = performance.now();
  const tick = now => {
    const t = (now - startAt) / 1000;
    $('prog').style.width = Math.min(100, t / total * 100) + '%';
    if (t >= total) { draw(total - 0.001); finish(); return; }
    draw(t);
    raf = requestAnimationFrame(tick);
  };
  raf = requestAnimationFrame(tick);
}
function finish() {
  cancelAnimationFrame(raf); raf = 0;
  if (shapeVid) shapeVid.pause();
  $('play').classList.remove('hidden'); $('stop').classList.add('hidden');
  const cb = onEnd; onEnd = null;
  if (cb) cb();
}
function stop() {
  if (!raf) return;
  if (shapeVid) shapeVid.pause();
  cancelAnimationFrame(raf); raf = 0; onEnd = null;
  if (recorder && recorder.state !== 'inactive') { recorder.onstop = null; recorder.stop(); }
  recorder = null;
  $('play').classList.remove('hidden'); $('stop').classList.add('hidden'); $('rec').disabled = false;
  setStatus('');
}
$('play').onclick = () => { setStatus(''); start(null); };
$('stop').onclick = stop;

$('rec').onclick = () => {
  stop();
  if (!window.MediaRecorder) { setStatus('このブラウザは録画に対応していません（Chrome / Edge をお使いください）。', true); return; }
  const types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  const ext = mime.startsWith('video/mp4') ? 'mp4' : 'webm';
  const chunks = [];
  recorder = new MediaRecorder(cv.captureStream(30), { mimeType: mime || undefined, videoBitsPerSecond: 8e6 });
  recorder.ondataavailable = e => { if (e.data.size) chunks.push(e.data); };
  recorder.onstop = () => {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    if (outUrl) URL.revokeObjectURL(outUrl);
    outUrl = URL.createObjectURL(blob);
    $('dl').href = outUrl; $('dl').download = `munker_illusion.${ext}`;
    $('dl').textContent = `動画をダウンロード（.${ext} / ${(blob.size / 1048576).toFixed(1)} MB）`;
    $('result').classList.remove('hidden');
    $('rec').disabled = false;
    setStatus('録画が完了しました。');
    recorder = null;
  };
  $('rec').disabled = true; $('result').classList.add('hidden');
  setStatus(`録画中…（約 ${Math.round(total)} 秒。タブを切り替えないでください）`);
  recorder.start();
  start(() => { if (recorder && recorder.state !== 'inactive') setTimeout(() => recorder && recorder.stop(), 300); });
};

syncUI();
rebuild();
})();
</script>
</body>
</html>
