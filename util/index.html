<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1220">
<title>HAMZWORKERZ UTIL</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  :root { --bg:#0d1220; --panel:#161d2f; --panel-line:#2a3550; --text:#e8ecf7; --muted:#8f9ac0; --accent:#56c7ff; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(1000px 520px at 50% -10%, #1c2a4a 0, transparent 60%), var(--bg);
    color: var(--text);
    font-family: "Courier New", ui-monospace, monospace;
    padding: 7vh 20px 60px;
    display: flex; flex-direction: column; align-items: center;
  }
  header { text-align: center; margin-bottom: 44px; }
  h1 { font-size: clamp(24px, 7vw, 48px); letter-spacing: .1em; color: #fff;
       text-shadow: 0 0 12px rgba(86,199,255,.55), 0 0 30px rgba(86,199,255,.25); }
  header p { margin-top: 12px; color: var(--muted); font-size: 13px; letter-spacing: .22em; }
  .grid { width: 100%; max-width: 760px; display: grid; gap: 18px;
          grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  .card { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--panel-line);
          border-radius: 16px; padding: 22px 22px 20px; text-decoration: none; color: inherit;
          transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease; }
  .card:hover, .card:focus-visible { transform: translateY(-4px); border-color: var(--card-accent, var(--accent));
          box-shadow: 0 12px 32px rgba(0,0,0,.45); outline: none; }
  .icon { width: 56px; height: 56px; border-radius: 12px; display: grid; place-items: center; font-size: 30px;
          background: rgba(86,199,255,.12); border: 1px solid var(--card-accent, var(--accent)); }
  .card h2 { margin-top: 16px; font-size: 20px; letter-spacing: .06em; color: var(--card-accent, var(--accent)); }
  .card .desc { margin-top: 8px; color: var(--muted); font-size: 13px; line-height: 1.6; flex: 1; }
  .card .play { margin-top: 18px; font-size: 13px; letter-spacing: .18em; }
  .card .play::after { content: " \25B6"; color: var(--card-accent, var(--accent)); }
  footer { margin-top: 44px; color: var(--muted); font-size: 11px; letter-spacing: .1em; text-align: center; }
</style>
</head>
<body>
  <header>
    <h1>HAMZWORKERZ UTIL</h1>
    <p>SELECT A TOOL</p>
  </header>

  <main class="grid">
    <a class="card" style="--card-accent:#4da3ff" href="mp4-to-gif/">
      <div class="icon">🎞️</div>
      <h2>MP4 → GIF</h2>
      <p class="desc">動画（MP4）をGIFアニメに変換。範囲・サイズ・fpsを指定。ブラウザ内で処理され、アップロードされません。</p>
      <span class="play">OPEN</span>
    </a>

    <a class="card" style="--card-accent:#c9a0ff" href="silhouette-illusion/">
      <div class="icon">🌀</div>
      <h2>SILHOUETTE ILLUSION</h2>
      <p class="desc">シルエットの錯視を3Dで見せるツール。</p>
      <span class="play">OPEN</span>
    </a>
  </main>

  <footer><a href="../" style="color:inherit">← HAMZWORKERZ GAMES</a></footer>
</body>
</html>
